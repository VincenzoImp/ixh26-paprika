<!doctype html>
<!-- Paprika web app: the page shell. One connected MetaMask account per window. Navigation: Verify (home, no
     wallet needed) · Attest · My activity · Explorer. The content of each page is drawn by js/pages/*.js.
     Local network tools and the network banner exist only on the local chain (network.json says local). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Paprika · photo provenance on Ethereum</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/styles.css">
<script type="importmap">{ "imports": { "ethers": "/vendor/ethers.min.js" } }</script>
<script type="module" src="/app.js"></script>
</head>
<body>
<header>
 <a class="logo" href="#/verify">PAPRIKA</a>
 <nav>
  <a href="#/verify" data-v="verify" data-testid="nav-verify">Verify</a>
  <a href="#/attest" data-v="attest" data-testid="nav-attest">Attest</a>
  <a href="#/activity" data-v="activity" data-testid="nav-activity">My activity</a>
  <a href="#/explorer" data-v="explorer" data-testid="nav-explorer">Explorer</a>
 </nav>
 <div class="hdr-right">
  <label class="pv" title="Show how the protocol works, step by step"><input type="checkbox" data-testid="protocol-toggle"> Protocol view</label>
  <button type="button" class="netpill" data-testid="network-pill" title="Network · click for the local network tools">● connecting…</button>
  <div class="account" data-testid="account"></div>
 </div>
</header>
<div class="localtools hidden" data-testid="local-tools"></div>
<div class="menu-slot hidden" data-testid="account-menu-slot"></div>
<div class="shell">
 <main data-testid="page"><p class="d">Loading…</p></main>
 <aside class="drawer hidden" data-testid="protocol-drawer"></aside>
</div>
<div class="toasts" data-testid="toasts"></div>
</body>
</html>
